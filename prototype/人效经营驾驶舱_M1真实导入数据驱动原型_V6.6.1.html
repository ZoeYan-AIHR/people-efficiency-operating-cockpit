<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="人效经营驾驶舱｜M1 真实导入数据驱动交互原型" />
  <title>人效经营驾驶舱｜M1 真实导入数据驱动原型 V6.6.1</title>
  <style>
    :root {
      --bg: #f4f7fc;
      --surface: #ffffff;
      --surface-soft: #f8faff;
      --ink: #18233a;
      --ink-2: #465671;
      --muted: #8a96aa;
      --line: #e6ebf4;
      --line-strong: #d7dfed;
      --blue: #4b61e8;
      --blue-2: #745eea;
      --blue-soft: #edf0ff;
      --cyan: #2ca9d7;
      --green: #18a67b;
      --green-soft: #e9faf3;
      --orange: #ee9a36;
      --orange-soft: #fff5e8;
      --red: #e75e68;
      --red-soft: #fff0f1;
      --purple: #9568e8;
      --purple-soft: #f4efff;
      --shadow: 0 14px 34px rgba(31, 51, 95, 0.08);
      --shadow-hover: 0 20px 40px rgba(31, 51, 95, 0.13);
      --radius: 18px;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      min-width: 1180px;
      margin: 0;
      color: var(--ink);
      background: linear-gradient(145deg, #f8faff 0%, #eff4fc 100%);
      font-family: Inter, "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button, select, input { font: inherit; }
    button { cursor: pointer; }

    .app-shell { display: flex; min-height: 100vh; }

    .sidebar {
      position: fixed;
      z-index: 5;
      top: 0;
      bottom: 0;
      left: 0;
      width: 244px;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: 20px 14px 24px;
      border-right: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.94);
      box-shadow: 8px 0 30px rgba(48, 71, 120, 0.02);
      scrollbar-width: thin;
      scrollbar-color: #cfd7e8 transparent;
    }
    .sidebar::-webkit-scrollbar { width: 6px; }
    .sidebar::-webkit-scrollbar-thumb { border-radius: 99px; background: #cfd7e8; }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 4px 10px 21px;
      border-bottom: 1px solid var(--line);
    }

    .brand-mark {
      display: grid;
      width: 40px;
      height: 40px;
      place-items: center;
      border-radius: 14px;
      color: #fff;
      font-size: 18px;
      font-weight: 800;
      background: linear-gradient(135deg, #415ee7, #8064ec);
      box-shadow: 0 9px 20px rgba(73, 93, 226, 0.25);
    }

    .brand-name { font-size: 16px; font-weight: 800; letter-spacing: 0.1px; }
    .brand-sub { margin-top: 3px; color: var(--muted); font-size: 11px; }

    .nav { padding: 18px 2px; }
    .nav-group { margin-bottom: 19px; }
    .nav-label { padding: 0 10px 8px; color: #a3adc0; font-size: 10px; font-weight: 800; letter-spacing: 1px; }

    .nav-item {
      display: flex;
      width: 100%;
      align-items: center;
      gap: 11px;
      margin: 2px 0;
      padding: 10px;
      border: 0;
      border-radius: 11px;
      color: #718099;
      text-align: left;
      font-size: 13px;
      background: transparent;
      transition: all 0.18s ease;
    }

    .nav-item:hover { color: #3e4f6c; background: #f7f9fd; }
    .nav-item.active { color: #3e51d3; font-weight: 800; background: #edf0ff; }
    .nav-icon { width: 18px; color: currentColor; font-size: 16px; text-align: center; }
    .nav-dot { width: 6px; height: 6px; margin-left: auto; border-radius: 50%; background: var(--red); }

    
    .sidebar-bottom {
      margin-top: 12px;
      padding: 8px 10px;
      border: 1px solid #e3e8f4;
      border-radius: 10px;
      color: #5b6a82;
      background: #f8fafd;
    }

    .sidebar-bottom strong { font-size: 10.5px; color: #3f7f66; font-weight: 800; }
    .sidebar-bottom p { margin: 4px 0 0; color: #9aa5b6; font-size: 10px; line-height: 1.5; }
    .sidebar-bottom button { margin-top: 5px; padding: 0; border: 0; color: #5868d9; font-size: 10px; font-weight: 800; background: transparent; }

    .workspace { width: calc(100% - 244px); margin-left: 244px; }

    .topbar {
      position: sticky;
      z-index: 4;
      top: 0;
      display: flex;
      height: 70px;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(15px);
    }

    .breadcrumb { color: var(--muted); font-size: 12px; }
    .breadcrumb b { color: #586981; font-weight: 800; }

    .top-actions { display: flex; align-items: center; gap: 10px; }
    .top-search { width: 245px; padding: 9px 13px; border-radius: 10px; color: #a1abbc; font-size: 12px; background: #f7f9fc; }
    .top-icon-button {
      position: relative;
      display: grid;
      width: 34px;
      height: 34px;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 10px;
      color: #71809a;
      background: #fff;
    }

    .top-icon-button i { position: absolute; top: 7px; right: 7px; width: 6px; height: 6px; border-radius: 50%; background: var(--red); }
    .avatar { display: flex; align-items: center; gap: 8px; padding: 4px 8px 4px 5px; border: 1px solid var(--line); border-radius: 11px; color: #596982; font-size: 12px; font-weight: 800; }
    .avatar-mark { display: grid; width: 25px; height: 25px; place-items: center; border-radius: 8px; color: #fff; font-size: 10px; background: linear-gradient(135deg, #7765ef, #c36fe8); }

    .page-viewport { max-width: 1780px; min-height: calc(100vh - 70px); margin: 0 auto; padding: 26px 28px 38px; }

    .page-enter { animation: pageIn 0.25s ease-out; }
    @keyframes pageIn { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: translateY(0); } }

    .page-heading { display: flex; align-items: flex-end; justify-content: space-between; gap: 22px; margin-bottom: 19px; }
    .page-heading h1 { margin: 0; font-size: 25px; letter-spacing: -0.55px; }
    .page-heading p { max-width: 760px; margin: 8px 0 0; color: #7f8ba1; font-size: 13px; line-height: 1.6; }
    .heading-badge { display: inline-flex; align-items: center; gap: 5px; margin-left: 8px; padding: 4px 9px; border-radius: 99px; color: #5463d8; font-size: 11px; font-weight: 800; vertical-align: middle; background: #eef0ff; }

    .global-filters { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; }
    .filter { display: flex; align-items: center; gap: 7px; padding: 9px 11px; border: 1px solid var(--line); border-radius: 10px; background: #fff; box-shadow: 0 2px 4px rgba(46, 61, 91, 0.02); }
    .filter span { color: #8090a7; font-size: 12px; }
    .filter select { max-width: 142px; border: 0; outline: 0; color: #44516a; font-size: 12px; font-weight: 800; background: transparent; }

    .grid { display: grid; gap: 16px; }
    .card { border: 1px solid rgba(230, 235, 244, 0.95); border-radius: var(--radius); background: #fff; box-shadow: var(--shadow); }
    .card-pad { padding: 18px; }
    .section-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
    .section-title { display: flex; align-items: center; gap: 9px; }
    .section-title h2 { margin: 0; color: #344157; font-size: 14px; font-weight: 800; }
    .section-title p { margin: 3px 0 0; color: var(--muted); font-size: 10px; }
    .mini-icon { display: grid; width: 30px; height: 30px; flex: 0 0 auto; place-items: center; border-radius: 10px; color: #5967d9; font-size: 15px; background: var(--blue-soft); }
    .head-actions { display: flex; align-items: center; gap: 7px; }
    .chip { display: inline-flex; align-items: center; gap: 5px; padding: 5px 9px; border-radius: 99px; color: #66748c; font-size: 10px; font-weight: 800; background: #f4f6f9; }
    .chip.blue { color: #5867d9; background: var(--blue-soft); }
    .chip.green { color: #168962; background: var(--green-soft); }
    .chip.orange { color: #c57b22; background: var(--orange-soft); }
    .chip.red { color: #d5515b; background: var(--red-soft); }
    .chip.purple { color: #7858d1; background: var(--purple-soft); }

    .soft-button, .primary-button, .outline-button, .tiny-button {
      border: 0;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 800;
      transition: all 0.18s ease;
    }

    .soft-button { padding: 8px 10px; color: #5c68d9; background: #eef0ff; }
    .soft-button:hover { background: #e1e5ff; }
    .primary-button { padding: 10px 13px; color: #fff; background: linear-gradient(135deg, #4a61e8, #735fe8); box-shadow: 0 8px 17px rgba(81, 97, 224, 0.2); }
    .primary-button:hover { transform: translateY(-1px); box-shadow: 0 12px 22px rgba(81, 97, 224, 0.28); }
    .outline-button { padding: 9px 11px; border: 1px solid var(--line); color: #637188; background: #fff; }
    .outline-button:hover { border-color: #bec9e2; color: #4658d3; }
    .tiny-button { padding: 6px 8px; color: #66748d; background: #f7f9fc; }
    .tiny-button:hover { color: #5162d7; background: #eff2ff; }

    .workflow-strip { display: grid; grid-template-columns: repeat(4, 1fr); margin-bottom: 16px; overflow: hidden; border: 1px solid var(--line); border-radius: 15px; background: #fff; box-shadow: 0 5px 18px rgba(33, 56, 98, 0.04); }
    .workflow-step { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-right: 1px solid var(--line); color: #74829a; text-align: left; background: #fff; transition: all .18s; }
    .workflow-step:last-child { border-right: 0; }
    .workflow-step:hover { color: #4d5fd8; background: #f8f9ff; }
    .workflow-step b { display: grid; width: 24px; height: 24px; flex: 0 0 auto; place-items: center; border-radius: 8px; color: #5a69d7; font-size: 11px; background: #eef0ff; }
    .workflow-step strong { display: block; color: #526078; font-size: 11px; }
    .workflow-step span { display: block; margin-top: 2px; color: #a1abbb; font-size: 10px; }

    .dashboard-hero { grid-template-columns: 2fr 1fr; }
    .health-card { position: relative; min-height: 188px; overflow: hidden; padding: 22px 24px; color: #fff; background: linear-gradient(120deg, #3b59e4 0%, #4e64eb 47%, #7e5fe8 100%); }
    .health-card:before { position: absolute; top: -112px; right: -80px; width: 232px; height: 232px; border: 1px solid rgba(255,255,255,.2); border-radius: 50%; content: ""; }
    .health-card:after { position: absolute; right: 105px; bottom: -70px; width: 130px; height: 130px; border-radius: 50%; background: rgba(255,255,255,.08); content: ""; }
    .health-inner { position: relative; z-index: 1; display: grid; grid-template-columns: 1fr 1.08fr; gap: 20px; height: 100%; }
    .health-label { display: flex; align-items: center; gap: 7px; color: #e4e8ff; font-size: 13px; }
    .health-score { margin-top: 17px; font-size: 57px; font-weight: 800; letter-spacing: -2px; }
    .health-score small { color: #e0e5ff; font-size: 17px; font-weight: 600; letter-spacing: 0; }
    .health-state { margin-top: 8px; color: #e9ebff; font-size: 12px; }
    .white-pill { display: inline-block; margin-right: 6px; padding: 4px 8px; border-radius: 20px; color: #4d58d8; font-size: 10px; font-weight: 800; background: #fff; }
    .meter { height: 6px; margin-top: 17px; overflow: hidden; border-radius: 10px; background: rgba(255,255,255,.23); }
    .meter i { display: block; height: 100%; border-radius: 10px; background: #fff; transition: width .3s; }
    .summary-box { align-self: center; padding: 14px; border: 1px solid rgba(255,255,255,.22); border-radius: 14px; background: rgba(255,255,255,.13); }
    .summary-box b { font-size: 12px; }
    .summary-box p { margin: 9px 0 0; color: #f1f2ff; font-size: 12px; line-height: 1.65; }
    .summary-box .update { margin-top: 11px; color: #d7dcff; font-size: 10px; }

    .ai-card { min-height: 188px; padding: 18px; }
    .ai-copy { margin: 15px 0 0; color: #67758c; font-size: 12px; line-height: 1.62; }
    .ai-title { margin-bottom: 4px; color: #2c374c; font-size: 13px; font-weight: 800; }
    .ask { display: flex; gap: 7px; margin-top: 12px; }
    .ask input { min-width: 0; flex: 1; padding: 8px 9px; border: 1px solid var(--line); border-radius: 9px; outline: 0; color: #4b5971; font-size: 11px; background: #f8faff; }
    .ask input:focus { border-color: #a9b4ff; background: #fff; }
    .ask button { padding: 8px 10px; border: 0; border-radius: 9px; color: #fff; font-size: 11px; font-weight: 800; background: #222e47; }
    .ai-detail { margin-top: 10px; padding: 10px; border-radius: 10px; color: #594991; font-size: 10px; line-height: 1.65; background: #f3f0ff; }

    .metrics { grid-template-columns: repeat(4, 1fr); margin-top: 16px; }
    .metric { min-height: 138px; padding: 16px; overflow: hidden; transition: all .18s ease; }
    .metric:hover { transform: translateY(-2px); box-shadow: var(--shadow-hover); }
    .metric-top { display: flex; align-items: flex-start; justify-content: space-between; }
    .metric-label { color: #7e8ba0; font-size: 12px; }
    .metric-help { color: #bec7d5; font-size: 11px; }
    .metric-icon { display: grid; width: 30px; height: 30px; place-items: center; border-radius: 10px; color: #5366df; background: #f2f4ff; }
    .metric-value { margin-top: 13px; color: #253149; font-size: 27px; font-weight: 800; letter-spacing: -1px; }
    .metric-bottom { display: flex; align-items: flex-end; justify-content: space-between; gap: 6px; margin-top: 11px; }
    .trend-tag { display: inline-flex; align-items: center; gap: 3px; padding: 4px 7px; border-radius: 20px; font-size: 10px; font-weight: 800; }
    .trend-tag.green { color: #118a63; background: var(--green-soft); }
    .trend-tag.red { color: #d14954; background: var(--red-soft); }
    .trend-tag.indigo { color: #5262d4; background: var(--blue-soft); }
    .metric-hint { margin-top: 5px; color: #a3adbd; font-size: 10px; }
    .mini-chart { width: 78px; height: 34px; }

    .dashboard-mid, .dashboard-bottom { grid-template-columns: 2fr 1fr; margin-top: 16px; }
    .chart-card, .risk-card, .driver-card, .alert-card, .bubble-card, .task-card { padding: 18px; }
    .line-legend { display: flex; align-items: center; gap: 13px; color: #8b96a9; font-size: 10px; }
    .legend-line { display: inline-block; width: 15px; height: 2px; border-radius: 4px; vertical-align: middle; background: #5264e6; }
    .legend-dash { display: inline-block; width: 15px; height: 0; border-top: 2px dashed #a0aabe; vertical-align: middle; }
    .chart-box { height: 250px; margin-top: 15px; }
    .risk-list { display: grid; gap: 13px; margin-top: 16px; }
    .risk-row-top { display: flex; align-items: center; justify-content: space-between; font-size: 12px; }
    .risk-name { display: flex; align-items: center; gap: 7px; color: #4e5d74; font-weight: 800; }
    .risk-dot { width: 7px; height: 7px; border-radius: 50%; }
    .risk-state { padding: 4px 7px; border-radius: 20px; font-size: 10px; font-weight: 800; }
    .risk-bar { height: 6px; margin: 8px 0 5px; overflow: hidden; border-radius: 20px; background: #eef1f6; }
    .risk-bar i { display: block; height: 100%; border-radius: 20px; }
    .risk-note { color: #a1aabb; font-size: 10px; }

    .formula { padding: 7px 10px; border-radius: 20px; color: #6c7890; font-size: 10px; font-weight: 800; background: #f5f7fb; }
    .driver-content { margin-top: 16px; }
    .driver-nodes { display: grid; grid-template-columns: repeat(4, 1fr); gap: 9px; }
    .node { padding: 13px; border: 1px solid; border-radius: 13px; }
    .node small { font-size: 10px; font-weight: 800; opacity: .8; }
    .node b { display: block; margin-top: 7px; font-size: 20px; letter-spacing: -.5px; }
    .node span { display: block; margin-top: 6px; font-size: 10px; opacity: .75; }
    .node.blue { color: #3c68d1; border-color: #d9e7ff; background: #eff6ff; }
    .node.purple { color: #7759d1; border-color: #e8ddff; background: #f6f2ff; }
    .node.orange { color: #c87a20; border-color: #ffebcb; background: #fff7e9; }
    .node.green-node { color: #16906b; border-color: #d7f2e8; background: #effbf6; }
    .driver-foot { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 11px; }
    .soft-stat { display: flex; align-items: center; justify-content: space-between; padding: 11px 13px; border-radius: 13px; background: #f7f9fc; }
    .soft-stat small { color: #929caf; font-size: 10px; }
    .soft-stat b { display: block; margin-top: 4px; font-size: 15px; }
    .soft-stat span { color: #b8c0cf; font-size: 17px; }

    .alerts { display: grid; gap: 7px; margin-top: 14px; }
    .alert { width: 100%; padding: 10px; border: 1px solid transparent; border-radius: 12px; text-align: left; background: #f8faff; transition: all .16s; }
    .alert:hover, .alert.active { border-color: #d5ddff; background: #f0f2ff; }
    .alert-top { display: flex; align-items: flex-start; gap: 8px; }
    .alert-dot { width: 7px; height: 7px; flex: 0 0 auto; margin-top: 5px; border-radius: 50%; }
    .alert-title { color: #3f4d64; font-size: 11px; font-weight: 800; line-height: 1.4; }
    .alert-detail { padding-left: 15px; margin-top: 4px; color: #8996a9; font-size: 10px; line-height: 1.5; }
    .alert-meta { display: flex; justify-content: space-between; padding-left: 15px; margin-top: 7px; color: #a4adbd; font-size: 10px; }
    .evidence { display: grid; grid-template-columns: repeat(2, 1fr); gap: 7px; margin-top: 12px; }
    .evidence button { padding: 7px 9px; border: 1px solid #e5eaf4; border-radius: 9px; color: #5a6982; font-size: 10px; font-weight: 700; text-align: left; background: #fff; }
    .evidence button:hover { border-color: #c9d3ff; color: #5161d8; background: #f5f7ff; }
    .action-box { margin-top: 12px; padding: 11px; border: 1px solid #dde2ff; border-radius: 12px; background: #eef1ff; }
    .action-box span { color: #5664cf; font-size: 10px; font-weight: 800; }
    .action-box b { display: block; margin-top: 5px; color: #303d76; font-size: 11px; line-height: 1.45; }
    .action-box p { margin: 6px 0 0; color: #6572b1; font-size: 10px; }

    .bubble-box { height: 262px; margin-top: 16px; }
    .chart-note { margin-top: 7px; padding: 10px 12px; border-radius: 12px; color: #8490a2; font-size: 10px; line-height: 1.55; background: #f7f9fc; }
    .chart-note b { color: #5f6d82; }
    .task-list { display: grid; gap: 9px; margin-top: 14px; }
    .task { padding: 11px; border: 1px solid var(--line); border-radius: 12px; }
    .task-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
    .task-title { color: #3f4c61; font-size: 11px; font-weight: 800; line-height: 1.45; }
    .task-meta { margin-top: 4px; color: #a0aabc; font-size: 10px; }
    .task-status { padding: 4px 6px; border-radius: 20px; font-size: 10px; font-weight: 800; white-space: nowrap; }
    .progress { height: 5px; margin-top: 10px; overflow: hidden; border-radius: 20px; background: #edf0f5; }
    .progress i { display: block; height: 100%; border-radius: 20px; background: #5969e4; }
    .progress-label { display: flex; justify-content: space-between; margin-top: 5px; color: #9ca6b7; font-size: 10px; }
    .view-all { width: 100%; margin-top: 10px; padding: 9px; border: 1px solid var(--line); border-radius: 10px; color: #67758a; font-size: 11px; font-weight: 800; background: #fff; }

    .tip-card { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 15px; margin-top: 16px; background: #f7f9fc; }
    .tip-left { display: flex; align-items: flex-start; gap: 11px; }
    .tip-icon { display: grid; width: 32px; height: 32px; flex: 0 0 auto; place-items: center; border-radius: 10px; color: #5768db; background: #fff; box-shadow: 0 3px 8px rgba(38,52,90,.06); }
    .tip-card b { color: #4a5870; font-size: 12px; }
    .tip-card p { margin: 5px 0 0; color: #8d98aa; font-size: 10px; }

    /* Shared detail page styles */
    .page-grid-2 { display: grid; grid-template-columns: 1.55fr 1fr; gap: 16px; }
    .page-grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
    .page-grid-wide { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; }
    .subnav { display: flex; align-items: center; gap: 8px; margin: 0 0 16px; }
    .subnav button { padding: 8px 11px; border: 1px solid transparent; border-radius: 9px; color: #748198; font-size: 11px; font-weight: 800; background: #fff; }
    .subnav button.active { border-color: #dce1ff; color: #5464d8; background: #eef0ff; }
    .subnav button:hover { background: #f7f9fc; }

    .formula-band { position: relative; overflow: hidden; padding: 20px; border-radius: 18px; color: #fff; background: linear-gradient(120deg, #293d70, #4a55ae); box-shadow: var(--shadow); }
    .formula-band:after { position: absolute; top: -65px; right: -35px; width: 180px; height: 180px; border: 1px solid rgba(255,255,255,.2); border-radius: 50%; content: ""; }

  org: ['org_code', 'org_name'],
  workforce: ['period', 'org_code', 'average_fte'],
  output: ['period', 'org_code', 'recognized_revenue', 'operating_profit'],
  process: ['period', 'org_code', 'metric_code', 'metric_value'],
  config: ['scenario_id', 'primary_output_metric', 'fte_rule', 'labor_cost_scope'],
  target: ['period', 'scope_code', 'metric_code']
};

function m1XmlDecode(value) {
  return String(value ?? '')
    .replace(/<!\[CDATA\[([\s\S]*?)\]\]>/g, '$1')
    .replace(/&lt;/g, '<')
    .replace(/&gt;/g, '>')
    .replace(/&quot;/g, '"')
    .replace(/&apos;/g, "'")
    .replace(/&amp;/g, '&')
    .replace(/&#x([0-9a-fA-F]+);/g, (_, n) => String.fromCodePoint(parseInt(n, 16)))
    .replace(/&#(\d+);/g, (_, n) => String.fromCodePoint(parseInt(n, 10)));
}

function m1XmlText(fragment) {
  return m1XmlDecode(String(fragment ?? '').replace(/<[^>]*>/g, ''));
}

function m1Attr(text, name) {
  const m = String(text || '').match(new RegExp(`(?:^|\\s)${name.replace(':', '\\:')}=["']([^"']*)["']`));
  return m ? m1XmlDecode(m[1]) : '';
}

function m1ColumnIndex(ref) {
  const letters = String(ref || '').match(/[A-Z]+/i)?.[0] || '';
  let n = 0;
  for (const char of letters.toUpperCase()) n = n * 26 + char.charCodeAt(0) - 64;
  return Math.max(0, n - 1);
}

function m1NormalizeHeader(value) {
  return String(value ?? '').trim().toLowerCase().replace(/^\ufeff/, '');
}

function m1ToNumber(value) {
  if (typeof value === 'number' && Number.isFinite(value)) return value;
  const text = String(value ?? '').trim().replace(/,/g, '');
  if (!text || text[0] === '=') return null;
  if (/^-?[\d.]+%$/.test(text)) return Number(text.slice(0, -1)) / 100;
  const n = Number(text);
  return Number.isFinite(n) ? n : null;
}

function m1PathResolve(baseFile, target) {
  if (target.startsWith('/')) return target.replace(/^\//, '');
  const base = baseFile.split('/').slice(0, -1);
  for (const part of target.split('/')) {
    if (!part || part === '.') continue;
    if (part === '..') base.pop();
    else base.push(part);
  }
  return base.join('/');
}

async function m1InflateRaw(bytes) {
  if (typeof DecompressionStream === 'undefined') {
    throw new Error('当前浏览器不支持离线 XLSX 解压。请使用最新版 Chrome / Edge，或改用 CSV 导入。');
  }
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  return new Uint8Array(await new Response(stream).arrayBuffer());
}

async function m1UnzipEntries(buffer) {
  const bytes = new Uint8Array(buffer);
  const view = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
  let eocd = -1;
  const min = Math.max(0, bytes.length - 65557);
  for (let i = bytes.length - 22; i >= min; i--) {
    if (view.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  }
  if (eocd < 0) throw new Error('无法识别 XLSX 压缩包目录。请确认文件未损坏且为标准 .xlsx 文件。');
  const entryCount = view.getUint16(eocd + 10, true);
  const centralOffset = view.getUint32(eocd + 16, true);
  const decoder = new TextDecoder('utf-8');
  const entries = new Map();
  let pos = centralOffset;

  for (let i = 0; i < entryCount; i++) {
    if (view.getUint32(pos, true) !== 0x02014b50) throw new Error('XLSX 压缩目录格式异常。');
    const compression = view.getUint16(pos + 10, true);
    const compressedSize = view.getUint32(pos + 20, true);
    const nameLen = view.getUint16(pos + 28, true);
    const extraLen = view.getUint16(pos + 30, true);
    const commentLen = view.getUint16(pos + 32, true);
    const localOffset = view.getUint32(pos + 42, true);
    const name = decoder.decode(bytes.slice(pos + 46, pos + 46 + nameLen));

    if (view.getUint32(localOffset, true) !== 0x04034b50) throw new Error(`XLSX 条目「${name}」的本地文件头异常。`);
    const localNameLen = view.getUint16(localOffset + 26, true);
    const localExtraLen = view.getUint16(localOffset + 28, true);
    const dataStart = localOffset + 30 + localNameLen + localExtraLen;
    const compressed = bytes.slice(dataStart, dataStart + compressedSize);
    let data;
    if (compression === 0) data = compressed;
    else if (compression === 8) data = await m1InflateRaw(compressed);
    else throw new Error(`XLSX 条目「${name}」使用了暂不支持的压缩方式（${compression}）。`);
    entries.set(name, decoder.decode(data));
    pos += 46 + nameLen + extraLen + commentLen;
  }
  return entries;
}

function m1ParseSharedStrings(xml = '') {
  const values = [];
  for (const match of xml.matchAll(/<si\b[^>]*>([\s\S]*?)<\/si>/g)) {
    const text = [...match[1].matchAll(/<t\b[^>]*>([\s\S]*?)<\/t>/g)].map(x => m1XmlText(x[1])).join('');
    values.push(text);
  }
  return values;
}

function m1TagText(xml, tag) {
  const m = String(xml || '').match(new RegExp(`<${tag}\\b[^>]*>([\\s\\S]*?)<\\/${tag}>`));
  return m ? m1XmlText(m[1]) : '';
}

function m1ParseWorksheet(xml, sharedStrings) {
  const rows = [];
  for (const rowMatch of String(xml || '').matchAll(/<row\b([^>]*)>([\s\S]*?)<\/row>/g)) {
    const rowNo = Number(m1Attr(rowMatch[1], 'r')) || rows.length + 1;
    const values = [];
    for (const cellMatch of rowMatch[2].matchAll(/<c\b([^>]*)>([\s\S]*?)<\/c>/g)) {
      const attrs = cellMatch[1];
      const cellXml = cellMatch[2];
      const col = m1ColumnIndex(m1Attr(attrs, 'r'));
      const type = m1Attr(attrs, 't');
      const raw = m1TagText(cellXml, 'v');
      const formula = m1TagText(cellXml, 'f');
      let value = '';
      if (type === 's') value = sharedStrings[Number(raw)] ?? '';
      else if (type === 'inlineStr' || type === 'str') value = m1TagText(cellXml, 't') || raw;
      else if (type === 'b') value = raw === '1';
      else if (raw !== '') value = m1ToNumber(raw) ?? raw;
      else if (formula) value = `=${formula}`;
      values[col] = value;
    }
    rows.push({ rowNo, values });
  }
  return rows;
}

async function m1ParseXlsxBuffer(buffer) {
  const entries = await m1UnzipEntries(buffer);
  const workbook = entries.get('xl/workbook.xml');
  const rels = entries.get('xl/_rels/workbook.xml.rels');
  if (!workbook || !rels) throw new Error('文件不是可识别的 Excel 工作簿，缺少工作簿描述。');
  const relMap = new Map();
  for (const match of rels.matchAll(/<Relationship\b([^>]*)\/?>(?:<\/Relationship>)?/g)) {
    const id = m1Attr(match[1], 'Id');
    const target = m1Attr(match[1], 'Target');
    if (id && target) relMap.set(id, m1PathResolve('xl/workbook.xml', target));
  }
  const sharedStrings = m1ParseSharedStrings(entries.get('xl/sharedStrings.xml') || '');
  const sheets = {};
  for (const match of workbook.matchAll(/<sheet\b([^>]*)\/?>(?:<\/sheet>)?/g)) {
    const name = m1Attr(match[1], 'name');
    const rid = m1Attr(match[1], 'r:id') || m1Attr(match[1], 'id');
    const path = relMap.get(rid);
    if (name && path && entries.has(path)) sheets[name] = m1ParseWorksheet(entries.get(path), sharedStrings);
  }
  return { format: 'xlsx', sheets };
}

function m1ParseCsvText(text) {
  const rows = [];
  let cell = '', row = [], quoted = false;
  const pushCell = () => { row.push(cell); cell = ''; };
  const pushRow = () => { pushCell(); rows.push({ rowNo: rows.length + 1, values: row }); row = []; };
  for (let i = 0; i < text.length; i++) {
    const ch = text[i], next = text[i + 1];
    if (ch === '"' && quoted && next === '"') { cell += '"'; i++; continue; }
    if (ch === '"') { quoted = !quoted; continue; }
    if (ch === ',' && !quoted) { pushCell(); continue; }
    if ((ch === '\n' || ch === '\r') && !quoted) {
      if (ch === '\r' && next === '\n') i++;
      pushRow(); continue;
    }
    cell += ch;
  }
  if (cell.length || row.length) pushRow();
  return { format: 'csv', sheets: { 'CSV_数据': rows } };
}

function m1FindHeader(sheetRows = [], expected = []) {
  let best = null;
  for (const row of sheetRows) {
    const headers = row.values.map(m1NormalizeHeader);
    const hits = expected.filter(h => headers.includes(m1NormalizeHeader(h))).length;
    if (!best || hits > best.hits) best = { rowNo: row.rowNo, values: row.values, headers, hits };
  }
  return best && best.hits ? best : null;
}

function m1TableFromSheet(sheetRows, expectedHeaders) {
  const header = m1FindHeader(sheetRows, expectedHeaders);
  if (!header) return { header: null, rows: [] };
  const index = {};
  header.headers.forEach((h, i) => { if (h) index[h] = i; });
  const rows = sheetRows.filter(r => r.rowNo > header.rowNo).map(r => {
    const obj = { __rowNo: r.rowNo };
    Object.entries(index).forEach(([key, i]) => { obj[key] = r.values[i] ?? ''; });
    return obj;
  }).filter(row => Object.values(row).some((v, i) => i > 0 && String(v ?? '').trim() !== ''));
  return { header: { ...header, index }, rows };
}

function m1Sum(values) { return values.reduce((total, v) => total + (m1ToNumber(v) ?? 0), 0); }
function m1Unique(values) { return [...new Set(values.filter(v => String(v ?? '').trim() !== ''))]; }
function m1PeriodSort(periods) { return [...periods].sort((a, b) => String(a).localeCompare(String(b), 'zh-CN', { numeric: true })); }

function m1BuildSnapshot(parsed, sourceName = '本地数据文件') {
  const sheets = parsed.sheets || {};
  const sheetNames = Object.keys(sheets);
  const byPrefix = prefix => sheetNames.find(name => name.startsWith(prefix));
  const orgSheetName = byPrefix('02_组织维度');
  const workforceSheetName = byPrefix('03_人力投入_月度');
  const outputSheetName = byPrefix('04_业务产出_月度');
  const processSheetName = byPrefix('05_过程质量_月度');
  const configSheetName = byPrefix('01_配置_指标映射');
  const targetSheetName = byPrefix('06_目标标杆');

  const orgTable = orgSheetName ? m1TableFromSheet(sheets[orgSheetName], M1_HEADER_CONFIG.org) : { header: null, rows: [] };
  const workforceTable = workforceSheetName ? m1TableFromSheet(sheets[workforceSheetName], M1_HEADER_CONFIG.workforce) : { header: null, rows: [] };
  const outputTable = outputSheetName ? m1TableFromSheet(sheets[outputSheetName], M1_HEADER_CONFIG.output) : { header: null, rows: [] };
  const processTable = processSheetName ? m1TableFromSheet(sheets[processSheetName], M1_HEADER_CONFIG.process) : { header: null, rows: [] };
  const configTable = configSheetName ? m1TableFromSheet(sheets[configSheetName], M1_HEADER_CONFIG.config) : { header: null, rows: [] };
  const targetTable = targetSheetName ? m1TableFromSheet(sheets[targetSheetName], M1_HEADER_CONFIG.target) : { header: null, rows: [] };

  const orgNameMap = Object.fromEntries(orgTable.rows.map(row => [String(row.org_code || '').trim(), String(row.org_name || row.org_code || '').trim()]));
  const periods = m1PeriodSort(m1Unique([
    ...workforceTable.rows.map(r => String(r.period || '').trim()),
    ...outputTable.rows.map(r => String(r.period || '').trim())
  ]));
  const periodSetWorkforce = new Set(workforceTable.rows.map(r => String(r.period || '').trim()));
  const periodSetOutput = new Set(outputTable.rows.map(r => String(r.period || '').trim()));

  const byPeriod = {};
  for (const period of periods) {
    const groups = {};
    const ensure = code => groups[code] ||= {
      code, name: orgNameMap[code] || code || '未匹配组织', fte: 0, revenue: 0, grossProfit: 0, profit: 0,
      labor: 0, salary: 0, insurance: 0, other: 0, productiveHours: 0, availableHours: 0, overtimeHours: 0,
      qualitySum: 0, qualityCount: 0, delay: null, rework: null, rows: { workforce: 0, output: 0 }
    };
    for (const row of workforceTable.rows.filter(r => String(r.period || '').trim() === period)) {
      const code = String(row.org_code || '').trim();
      const g = ensure(code);
      const salary = m1ToNumber(row.salary_cost) ?? 0;
      const bonus = m1ToNumber(row.bonus_cost) ?? 0;
      const employer = m1ToNumber(row.employer_cost) ?? 0;
      const welfare = m1ToNumber(row.welfare_cost) ?? 0;
      const recruitment = m1ToNumber(row.recruitment_cost) ?? 0;
      const training = m1ToNumber(row.training_cost) ?? 0;
      const outsourcing = m1ToNumber(row.outsourcing_cost) ?? 0;
      const severance = m1ToNumber(row.severance_cost) ?? 0;
      const constructed = salary + bonus + employer + welfare + recruitment + training + outsourcing + severance;
      const total = m1ToNumber(row.labor_cost_total);
      g.fte += m1ToNumber(row.average_fte) ?? 0;
      g.salary += salary;
      g.insurance += employer;
      g.other += bonus + welfare + recruitment + training + outsourcing + severance;
      g.labor += total === null ? constructed : total;
      g.productiveHours += m1ToNumber(row.productive_hours) ?? 0;
      g.availableHours += m1ToNumber(row.available_hours) ?? 0;
      g.overtimeHours += m1ToNumber(row.overtime_hours) ?? 0;
      g.rows.workforce++;
    }
    for (const row of outputTable.rows.filter(r => String(r.period || '').trim() === period)) {
      const code = String(row.org_code || '').trim();
      const g = ensure(code);
      g.revenue += m1ToNumber(row.recognized_revenue) ?? m1ToNumber(row.primary_output_value) ?? 0;
      g.grossProfit += m1ToNumber(row.gross_profit) ?? 0;
      g.profit += m1ToNumber(row.operating_profit) ?? 0;
      const q = m1ToNumber(row.quality_score);
      if (q !== null) { g.qualitySum += q; g.qualityCount++; }
      g.rows.output++;
    }
    for (const row of processTable.rows.filter(r => String(r.period || '').trim() === period)) {
      const code = String(row.org_code || '').trim();
      const g = ensure(code);
      const metric = String(row.metric_code || '').toUpperCase();
      const value = m1ToNumber(row.metric_value);
      if (value !== null && /DELAY/.test(metric)) g.delay = value;
      if (value !== null && /REWORK/.test(metric)) g.rework = value;
    }
    const orgs = Object.values(groups).filter(g => g.code);
    const total = orgs.reduce((a, g) => ({
      fte: a.fte + g.fte, revenue: a.revenue + g.revenue, grossProfit: a.grossProfit + g.grossProfit, profit: a.profit + g.profit,
      labor: a.labor + g.labor, salary: a.salary + g.salary, insurance: a.insurance + g.insurance, other: a.other + g.other,
      productiveHours: a.productiveHours + g.productiveHours, availableHours: a.availableHours + g.availableHours, overtimeHours: a.overtimeHours + g.overtimeHours
    }), { fte:0, revenue:0, grossProfit:0, profit:0, labor:0, salary:0, insurance:0, other:0, productiveHours:0, availableHours:0, overtimeHours:0 });
    byPeriod[period] = { period, orgs, total };
  }

  const requiredSheetStatuses = M1_REQUIRED_SHEETS.map(name => ({ name, exists: !!sheetNames.find(x => x.startsWith(name)) }));
  const missingRequiredSheets = requiredSheetStatuses.filter(x => !x.exists).map(x => x.name);
  const missingOrgCodes = m1Unique([
    ...workforceTable.rows.map(r => String(r.org_code || '').trim()),
    ...outputTable.rows.map(r => String(r.org_code || '').trim())
  ].filter(code => code && !orgNameMap[code]));
  const invalidFte = workforceTable.rows.filter(r => (m1ToNumber(r.average_fte) ?? 0) <= 0);
  const differentPeriods = periods.filter(p => !periodSetWorkforce.has(p) || !periodSetOutput.has(p));
  const seenKeys = new Set(), duplicateKeys = [];
  for (const row of workforceTable.rows) {
    const key = ['period', 'org_code', 'job_family', 'job_level', 'employment_type'].map(k => String(row[k] || '').trim()).join('|');
    if (seenKeys.has(key)) duplicateKeys.push({ key, rowNo: row.__rowNo });
    seenKeys.add(key);
  }
  const totalCostChecks = workforceTable.rows.map(row => {
    const components = m1Sum(['salary_cost','bonus_cost','employer_cost','welfare_cost','recruitment_cost','training_cost','outsourcing_cost','severance_cost'].map(k => row[k]));
    const total = m1ToNumber(row.labor_cost_total);
    return { rowNo: row.__rowNo, total, components, diff: total === null ? null : Math.abs(total - components) };
  });
  const failedCostRows = totalCostChecks.filter(x => x.diff !== null && x.diff > Math.max(1, Math.abs(x.components) * .001));
  const formulaCostRows = totalCostChecks.filter(x => x.total === null).length;
  const processCoverage = processTable.rows.length > 0;
  const targetCoverage = targetTable.rows.length > 0;
  const configCoverage = configTable.rows.length > 0;

  const rules = [
    { id:'P0-01', level:'P0', title:'组织编码与有效组织版本', desc:'所有人力与业务事实记录须匹配组织维度。', status: missingRequiredSheets.includes('02_组织维度') || missingOrgCodes.length ? '阻断' : '通过', detail: missingRequiredSheets.includes('02_组织维度') ? '缺少 02_组织维度。' : missingOrgCodes.length ? `未匹配组织：${missingOrgCodes.join('、')}` : `已匹配 ${Object.keys(orgNameMap).length} 个组织编码。` },
    { id:'P0-02', level:'P0', title:'期间与组织边界一致性', desc:'收入、经营利润、FTE、成本必须使用同一统计期间与组织边界。', status: missingRequiredSheets.some(x => ['03_人力投入_月度','04_业务产出_月度'].includes(x)) || differentPeriods.length ? '阻断' : '通过', detail: differentPeriods.length ? `期间覆盖不一致：${differentPeriods.join('、')}` : `共同覆盖 ${periods.length} 个期间：${periods.join('、') || '—'}。` },
    { id:'P0-03', level:'P0', title:'全口径人工成本构成', desc:'工资、奖金、雇主成本、福利、招聘、培训、外包、离职补偿应能与人工成本总额对账。', status: missingRequiredSheets.includes('03_人力投入_月度') || failedCostRows.length ? '阻断' : '通过', detail: failedCostRows.length ? `${failedCostRows.length} 行成本总额与构成不一致。` : formulaCostRows ? `${formulaCostRows} 行总额为公式 / 无缓存，已按成本构成实时重算。` : '所有上传的人工成本总额均与构成相符。' },
    { id:'P0-04', level:'P0', title:'人均指标可回算', desc:'人均收入、人均利润、人均成本均需由对应总额与平均 FTE 回算。', status: invalidFte.length || !periods.length ? '阻断' : '通过', detail: invalidFte.length ? `${invalidFte.length} 行 average_fte 小于或等于 0。` : '所有有产出的组织均具备正值平均 FTE，可执行人均回算。' },
    { id:'P0-05', level:'P0', title:'集团与组织汇总', desc:'集团值须由已发布组织的有效数据加总，或使用配置的共享分摊规则。', status: periods.length && byPeriod[periods.at(-1)]?.orgs.length ? '通过' : '阻断', detail: periods.length ? `最新期间 ${periods.at(-1)} 共聚合 ${byPeriod[periods.at(-1)]?.orgs.length || 0} 个组织单元。` : '未找到可用于汇总的期间。' },
    { id:'P0-06', level:'P0', title:'事实主键重复检查', desc:'月度人力投入的期间 × 组织 × 岗位 × 职级 × 用工类型不得重复。', status: duplicateKeys.length ? '阻断' : '通过', detail: duplicateKeys.length ? `发现 ${duplicateKeys.length} 个重复主键，示例：${duplicateKeys[0].key}` : '未发现人力投入粒度重复。' },
    { id:'P0-07', level:'P0', title:'FTE 与工时合理性', desc:'平均 FTE 必须为正，有效工时不能大于可用工时。', status: invalidFte.length ? '阻断' : '通过', detail: invalidFte.length ? `发现 ${invalidFte.length} 条异常 FTE。` : '平均 FTE 合法；工时字段将用于过程效率指标。' },
    { id:'P0-08', level:'P0', title:'配置与指标版本存在性', desc:'主产出、FTE 规则和人工成本范围须有可追溯配置。', status: configCoverage ? '通过' : '阻断', detail: configCoverage ? '已读取 01_配置_指标映射，将生成 METRIC-M1-V1。' : '缺少 01_配置_指标映射，无法确认核心口径。' },
    { id:'P1-01', level:'P1', title:'过程与质量数据覆盖', desc:'过程、质量数据缺失时，相关归因和预警须降级显示。', status: processCoverage ? '通过' : '告警', detail: processCoverage ? `已读取 ${processTable.rows.length} 条过程 / 质量记录。` : '未检测到过程质量数据；基础经营指标仍可发布。' },
    { id:'P1-02', level:'P1', title:'目标与标杆覆盖', desc:'缺少预算、目标或标杆时，目标差和预警解释能力会受限。', status: targetCoverage ? '通过' : '告警', detail: targetCoverage ? `已读取 ${targetTable.rows.length} 条目标 / 标杆记录。` : '未检测到目标标杆数据；仅可基于趋势与规则进行分析。' }
  ];
  const blockCount = rules.filter(r => r.status === '阻断').length;
  const warningCount = rules.filter(r => r.status === '告警').length;
  const qualityScore = Math.max(0, Math.min(100, 100 - blockCount * 25 - warningCount * 4 - (formulaCostRows ? 1 : 0)));
  const mappingField = (table, field) => table.header && Object.prototype.hasOwnProperty.call(table.header.index, field) ? field : '';
  const mappingRows = [
    ['统计周期 period', mappingField(workforceTable, 'period') || mappingField(outputTable, 'period'), '业务日期 / 月份', '必填'],
    ['组织编码 org_code', mappingField(workforceTable, 'org_code') || mappingField(outputTable, 'org_code'), '组织维度 / 编码', '必填'],
    ['平均 FTE average_fte', mappingField(workforceTable, 'average_fte'), '人力投入 / 月均 FTE', '必填'],
    ['工资总额 salary_cost', mappingField(workforceTable, 'salary_cost'), '人工成本 / 工资', '必填'],
    ['人工成本 labor_cost_total', mappingField(workforceTable, 'labor_cost_total'), '人工成本 / 全口径', '必填'],
    ['确认收入 recognized_revenue', mappingField(outputTable, 'recognized_revenue'), '业务产出 / 确认收入', '必填'],
    ['经营利润 operating_profit', mappingField(outputTable, 'operating_profit'), '业务产出 / 经营利润', '必填'],
    ['毛利 gross_profit', mappingField(outputTable, 'gross_profit'), '业务产出 / 毛利', '推荐'],

async function m1ReadFile(file) {
  const name = String(file?.name || '').toLowerCase();
  if (!file) throw new Error('未找到待导入的文件。');
  if (name.endsWith('.xlsx')) return m1ParseXlsxBuffer(await file.arrayBuffer());
  if (name.endsWith('.csv')) return m1ParseCsvText(await file.text());
  throw new Error('仅支持 .xlsx 或 .csv 文件。M1 多工作表标准导入推荐使用 .xlsx。');
}

    const Y = v => T + (maxY - v) / (maxY - minY) * (H - T - B);

    }

    }).join('');
    let xticks = '';
    for (let i = 0; i < 5; i++) {

      xticks += `<text x="${X(v)}" y="${H-9}" text-anchor="middle" fill="#97a3b5" font-size="10">${v.toFixed(1)}万</text>`;

    }
    return `<div class="bubble-box" id="${id}" style="height:${height}px"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%;height:100%">${grids}<line x1="${L}" y1="${H-B}" x2="${W-R}" y2="${H-B}" stroke="#dce3ee"/>${bubbles}${xticks}${yticks}</svg></div>`;
  }

  function renderFinebiSvgLine(data, id, color, unit='万') {
    const W=520,H=185,L=29,R=30,T=12,B=27;
    const vals=data.map(x=>x[1]); const min=Math.min(...vals); const max=Math.max(...vals); const pad=(max-min||1)*0.28;
    const lo=Math.max(0,min-pad), hi=max+pad, range=hi-lo||1;
    const X=i=>L+i*(W-L-R)/(data.length-1); const Y=v=>T+(hi-v)/range*(H-T-B);
    const points=data.map((d,i)=>`${X(i).toFixed(1)},${Y(d[1]).toFixed(1)}`).join(' ');
    const area=`${L},${H-B} ${points} ${X(data.length-1)},${H-B}`;
    let grids='';
    for(let i=0;i<4;i++){ const val=lo+i*(hi-lo)/3; const y=Y(val); grids += `<line x1="${L}" y1="${y}" x2="${W-R}" y2="${y}" stroke="#e7ebf3" stroke-dasharray="3 4"/><text x="1" y="${y+3}" fill="#a0aaba" font-size="8">${val.toFixed(0)}</text>`; }
    const xlabels=data.map((d,i)=>`<text x="${X(i)}" y="${H-7}" text-anchor="middle" fill="#9ba6b7" font-size="9">${d[0]}</text>`).join('');
    const dots=data.map((d,i)=>`<circle cx="${X(i)}" cy="${Y(d[1])}" r="2.8" fill="#fff" stroke="${color}" stroke-width="1.8"/>`).join('');
    return `<div class="finebi-line" id="${id}"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%;height:100%;display:block"><defs><linearGradient id="fill-${id}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".26"/><stop offset="1" stop-color="${color}" stop-opacity=".01"/></linearGradient></defs>${grids}<polygon points="${area}" fill="url(#fill-${id})"/><polyline points="${points}" fill="none" stroke="${color}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>${dots}${xlabels}</svg></div>`;

  function forecastBaseForOrg() {
    const imported=m1ForecastBaseForView();
    if(imported) return imported;
    const m=v6Metrics(currentProfile()),f=(V6_UNIFIED[state.org]||V6_UNIFIED['全集团']).forecast,t=m.target;
    // V6.4 统一口径：预测基准使用模型预测值（f.*），目标使用经营目标（t.*）；
    // 默认基准情景下预测结果与目标保持真实差值，避免“预测=当前=目标”导致的 0 缺口假象。
    return { revenue:f.revPer ?? m.revPer, profit:f.profitPer ?? m.profitPer, cost:f.laborPer ?? m.laborPer, workforce:f.workforce ?? m.fte, need:f.need, dataQuality:f.quality, revenueTarget:t.revPer, profitTarget:t.profitPer, costTarget:t.laborPer, revMape:Math.max(4.1,f.mape-1), profitMape:f.mape, costMape:Math.max(3.3,f.mape-3.5), workforceMape:Math.max(3.9,f.mape-2.4) };
  }

  function getForecastModel() {
    const b=forecastBaseForOrg(), f=state.forecastFactors;
    const demandDelta=(f.demand-8)*.0055;
    const automationDelta=(f.automation-3)*.0025;
    const attritionDelta=(f.attrition-8.7)*.0018;
    const salaryDelta=(f.salary-3)*.0072;
    const hireGap=Math.round((f.hires*f.hireRate/100) - (108*.75));
    const scenarioBoost = state.forecastScenario==='growth' ? .025 : state.forecastScenario==='cost' ? -.006 : state.forecastScenario==='risk' ? -.065 : 0;
    const revenue=b.revenue*(1+demandDelta+automationDelta-attritionDelta+scenarioBoost);
    const cost=b.cost*(1+salaryDelta-(f.automation-3)*.0008+(state.forecastScenario==='cost' ? -.018 : state.forecastScenario==='risk' ? .015 : 0));
    const profit=b.profit + (revenue-b.revenue)*.33 - (cost-b.cost)*.52 + (state.forecastScenario==='growth'?.035:state.forecastScenario==='cost'?.025:state.forecastScenario==='risk'?-0.055:0);
    const baselineLeavers=Math.round(b.workforce*(f.attrition/100)/2);
    const workforce=Math.round(b.workforce + f.hires*f.hireRate/100 - baselineLeavers + (state.forecastScenario==='growth'?24:state.forecastScenario==='cost'?-18:state.forecastScenario==='risk'?-34:0));
    const gap=Math.max(0,b.need-workforce);
    const quality=Math.max(76,Math.min(98,b.dataQuality-(state.forecastScenario==='risk'?4:0)+(f.automation-3)*.35));
    const uncertainty = state.forecastScenario==='risk'?1.35: state.forecastScenario==='growth'?1.12:1;
    return { b,f,revenue,cost,profit,workforce,gap,quality,uncertainty,demandDelta,automationDelta,attritionDelta,salaryDelta,hireGap };
  }

  function forecastMetricMeta(key) {
    return {
      revenue:{ name:'人均营收', icon:'↗', unit:'万元 / 人月', short:'万元', target:'人均营收目标', color:'#6179e9', targetKey:'revenueTarget' },

      cost:{ name:'人均人工成本', icon:'¥', unit:'万元 / 人月', short:'万元', target:'人均成本红线', color:'#4bb29a', targetKey:'costTarget' },
      workforce:{ name:'人员供需', icon:'♙', unit:'人', short:'人', target:'需求编制', color:'#e29245', targetKey:'need' }
    }[key];
  }

  function buildForecastSeries(key, model) {
    const b=model.b;
    const historical = key==='revenue' ? [2.12,2.18,2.24,2.28,2.31,2.35,2.39,2.42,2.44,2.45,2.47,b.revenue] : key==='profit' ? [.31,.33,.34,.35,.37,.36,.38,.39,.40,.39,.40,b.profit] : key==='cost' ? [.83,.85,.87,.88,.89,.91,.91,.92,.93,.94,.95,b.cost] : [2358,2370,2391,2406,2424,2435,2450,2462,2473,2480,2484,b.workforce];
    const futureEnd = key==='revenue'?model.revenue:key==='profit'?model.profit:key==='cost'?model.cost:model.workforce;
    const start=historical[historical.length-1];
    const labels=['2025-09','10月','11月','12月','2026-01','02月','03月','04月','05月','06月','07月','08月','09月','10月','11月','12月','2027-01','02月'];
    const values=[...historical];
    for(let i=1;i<=6;i++){
      const t=i/6;
      const seasonal = key==='workforce'? Math.sin(i*1.5)*3 : Math.sin(i*1.25)*Math.max(.008,Math.abs(futureEnd-start)*.12);
      values.push(start+(futureEnd-start)*t+seasonal);
    }
    return {labels,values,actualCount:12};
  }

  function renderForecastMini(values, color) {
    const W=120,H=34,p=3,min=Math.min(...values),max=Math.max(...values),r=max-min||1;
    const pts=values.map((v,i)=>`${p+i*(W-p*2)/(values.length-1)},${H-p-(v-min)/r*(H-p*2)}`).join(' ');
    return `<div class="forecast-mini"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/></svg></div>`;
  }

  function renderForecastChart(key, model) {
    const meta=forecastMetricMeta(key), s=buildForecastSeries(key,model), W=840,H=300,L=40,R=17,T=16,B=34;
    const all=[...s.values];
    const rawMin=Math.min(...all),rawMax=Math.max(...all), pad=(rawMax-rawMin||1)*.30;
    const lo=Math.max(key==='workforce'?0:0,rawMin-pad),hi=rawMax+pad,range=hi-lo||1;
    const X=i=>L+i*(W-L-R)/(s.values.length-1), Y=v=>T+(hi-v)/range*(H-T-B);
    const actual=s.values.slice(0,s.actualCount).map((v,i)=>`${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(' ');
    const pred=s.values.slice(s.actualCount-1).map((v,j)=>`${X(j+s.actualCount-1).toFixed(1)},${Y(v).toFixed(1)}`).join(' ');
    const target=key==='workforce'?model.b.need:model.b[meta.targetKey];
    const targetY=Y(target);
    let grid='', xlabels='', dots='';
    for(let i=0;i<5;i++){ const v=lo+i*(hi-lo)/4, y=Y(v); grid+=`<line x1="${L}" y1="${y}" x2="${W-R}" y2="${y}" stroke="#e7ebf3" stroke-dasharray="4 4"/><text x="2" y="${y+4}" fill="#99a4b4" font-size="10">${key==='workforce'?Math.round(v):v.toFixed(2)}</text>`; }
    for(let i=0;i<s.labels.length;i+=2) xlabels+=`<text x="${X(i)}" y="${H-8}" text-anchor="middle" fill="#9aa5b5" font-size="9">${s.labels[i]}</text>`;
    for(let i=0;i<s.actualCount;i++) dots+=`<circle cx="${X(i)}" cy="${Y(s.values[i])}" r="2.5" fill="#fff" stroke="${meta.color}" stroke-width="1.8"/>`;
    const predVals=s.values.slice(s.actualCount-1); const lower=predVals.map((v,j)=>`${X(j+s.actualCount-1)},${Y(v-(hi-lo)*.10*model.uncertainty)}`).join(' '); const upper=predVals.slice().reverse().map((v,j)=>{const i=predVals.length-1-j;return `${X(i+s.actualCount-1)},${Y(v+(hi-lo)*.10*model.uncertainty)}`}).join(' ');
    const cutoff=X(s.actualCount-1);
    return `<div class="forecast-main-chart"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><defs><linearGradient id="forecastFill-${key}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${meta.color}" stop-opacity=".20"/><stop offset="1" stop-color="${meta.color}" stop-opacity=".01"/></linearGradient></defs><rect x="${cutoff}" y="${T}" width="${W-R-cutoff}" height="${H-T-B}" fill="#f5f6ff" opacity=".68"/>${grid}<line x1="${L}" y1="${targetY}" x2="${W-R}" y2="${targetY}" stroke="#d88b43" stroke-width="1.4" stroke-dasharray="6 5"/><line x1="${cutoff}" y1="${T}" x2="${cutoff}" y2="${H-B}" stroke="#b3bfd7" stroke-width="1.2" stroke-dasharray="3 4"/><polygon points="${lower} ${upper}" fill="${meta.color}" fill-opacity=".13"/><polyline points="${actual}" fill="none" stroke="${meta.color}" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><polyline points="${pred}" fill="none" stroke="${meta.color}" stroke-width="2.8" stroke-dasharray="6 5" stroke-linecap="round" stroke-linejoin="round"/>${dots}${xlabels}<text x="${cutoff+8}" y="${T+13}" fill="#8a96a8" font-size="9">预测期</text></svg></div>`;
  }

  function forecastStatus(key, model) {
    const b=model.b, value=key==='revenue'?model.revenue:key==='profit'?model.profit:key==='cost'?model.cost:model.gap;
    if(key==='revenue') return value < b.revenueTarget*.97 ? ['关注','#d48631','#fff5e8'] : ['健康','#188a65','#e9faf3'];
    if(key==='profit') return value < b.profitTarget*.92 ? ['高风险','#d85861','#fff0f1'] : ['可控','#188a65','#e9faf3'];
    if(key==='cost') return value > b.costTarget*1.02 ? ['预警','#d48631','#fff5e8'] : ['可控','#188a65','#e9faf3'];
    return value > 30 ? ['高风险','#d85861','#fff0f1'] : ['关注','#d48631','#fff5e8'];
  }

  function v6Forecast() {
    const b=forecastBaseForOrg(),f=state.forecastFactors;
    const demand=(f.demand-8)*.0055, auto=(f.automation-3)*.0025, attr=(f.attrition-8.7)*.0018, sal=(f.salary-3)*.0072;
    const scen=state.forecastScenario==='growth'?.025:state.forecastScenario==='cost'?.01:state.forecastScenario==='risk'?-0.065:0;
    const rev=b.revenue*(1+demand+auto-attr+scen), cost=b.cost*(1+sal-(f.automation-3)*.0008+(state.forecastScenario==='cost'?-0.02:state.forecastScenario==='risk'?.015:0));
    const profit=b.profit+(rev-b.revenue)*.32-(cost-b.cost)*.55+(state.forecastScenario==='growth'?.035:state.forecastScenario==='cost'?.025:state.forecastScenario==='risk'?-0.055:0);
    const workforce=Math.round(b.workforce+f.hires*f.hireRate/100-Math.round(b.workforce*f.attrition/100/2)+(state.forecastScenario==='growth'?24:state.forecastScenario==='cost'?-18:state.forecastScenario==='risk'?-34:0));
    const gap=Math.max(0,b.need-workforce),quality=Math.max(76,Math.min(98,b.dataQuality+(f.automation-3)*.35+(state.forecastScenario==='risk'?-4:0)));
    // V6.4 统一预警：全部由本函数实时计算，删除硬编码数组，保证与 KPI、四问、预测条同源一致
    const profitGap6m = Math.max(0,(b.profitTarget-profit))*workforce*6;   // 预测利润 vs 目标的六个月累计缺口（万元）
    const profitShortPct = b.profitTarget>0? (b.profitTarget-profit)/b.profitTarget*100 : 0;
    const costOverPct = b.costTarget>0? (cost-b.costTarget)/b.costTarget*100 : 0;
    const alerts=[];
    if(profit < b.profitTarget*.97){ alerts.push({level:'红色',color:'#dc5962',title:`人均利润预计低于目标 ${Math.max(0,profitShortPct).toFixed(1)}%`,detail:`未来六个月预计少实现利润 ${money(profitGap6m)}；收入增长不足以覆盖人工成本上升。`,action:'进入情景模拟测算经营杠杆',risk:'人均利润低于目标',gap:profitGap6m}); }
    if(gap>30){ alerts.push({level:'橙色',color:'#e39444',title:`关键岗位未来缺口 ${gap} 人`,detail:'若保持当前招聘完成率，重点项目交付与客户响应周期可能进一步承压。',action:'模拟补员与内部调配',risk:'关键岗位缺口',gap}); }
    if(cost > b.costTarget*1.02){ alerts.push({level:'橙色',color:'#e39444',title:`人均人工成本预计高于目标 ${costOverPct.toFixed(1)}%`,detail:'调薪、外包和福利成本叠加，预计进一步收缩经营利润空间。',action:'查看成本结构与降本情景',risk:'人均成本超标'}); }
    if(quality<88){ alerts.push({level:'黄色',color:'#7988e8',title:'数据完整率不足，预测区间扩大',detail:'数据完整率不足将降低预测可信度，建议补齐后重新计算。',action:'进入数据质量校验',risk:'预测数据完整率不足'}); }
    return {b,f,rev,cost,profit,workforce,gap,quality,alerts,revImpact:(rev-b.revenue)*workforce*6,profitImpact:(profit-b.profit)*workforce*6,costImpact:(cost-b.cost)*workforce*6,profitGap6m,profitShortPct};
  }

  function roiRenderTable(rows, cols, valFn, warnFn){ return `<table class="roi-table"><thead><tr>${cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${valFn(r).map((v,i)=>`<td class="${warnFn?(warnFn(r,i)?'warn':''):''}">${v}</td>`).join('')}</tr>`).join('')}</tbody></table>`; }

    function renderRoiDualLine(series, id){
    const W=560,H=190,L=36,R=46,T=14,B=20;
    const allVals=series.flatMap(s=>s.data.map(d=>d[1]));
    const min=Math.min(...allVals), max=Math.max(...allVals);
    const pad=(max-min||1)*0.3;
    const lo=Math.max(0,min-pad), hi=max+pad, range=hi-lo||1;
    const n=series[0].data.length;
    const X=i=>L+i*(W-L-R)/(n-1); const Y=v=>T+(hi-v)/range*(H-T-B);
    let grids='';
    for(let i=0;i<4;i++){ const val=lo+i*(hi-lo)/3; const y=Y(val); grids += `<line x1="${L}" y1="${y}" x2="${W-R}" y2="${y}" stroke="#e7ebf3" stroke-dasharray="3 4"/><text x="1" y="${y+3}" fill="#a0aaba" font-size="8">${Math.round(val)}</text>`; }
    const lines=series.map(s=>{
      const pts=s.data.map((d,i)=>`${X(i).toFixed(1)},${Y(d[1]).toFixed(1)}`).join(' ');
      const area=`${L},${H-B} ${pts} ${X(n-1)},${H-B}`;
      const dots=s.data.map((d,i)=>`<circle cx="${X(i)}" cy="${Y(d[1])}" r="2.8" fill="#fff" stroke="${s.color}" stroke-width="1.8"/>`).join('');
      return `<polygon points="${area}" fill="url(#g-${id}-${s.key})"/><polyline points="${pts}" fill="none" stroke="${s.color}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>${dots}`;
    }).join('');
    const legend=series.map(s=>`<span class="roi-legend-item"><i style="background:${s.color}"></i>${s.name}</span>`).join('');
    const xlabels=series[0].data.map(d=>`<span>${d[0]}</span>`).join('');
    return `<div class="roi-dual-wrap"><div class="roi-legend">${legend}</div><div class="roi-dual-body"><div class="roi-dual-svg"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%;height:100%;display:block">${series.map(s=>`<defs><linearGradient id="g-${id}-${s.key}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${s.color}" stop-opacity=".22"/><stop offset="1" stop-color="${s.color}" stop-opacity=".01"/></linearGradient></defs>`).join('')}${grids}${lines}</svg></div><div class="roi-dual-x">${xlabels}</div></div></div>`;
  }

function renderRoiEr(){
    const orgs = roiOrgRows(), all=V6_UNIFIED['全集团'];
    const baseEr = all.salary/all.revenue*100;   // 集团实际 E/R 作为预算参考基准
    const budgetEr = baseEr*1.01;                // 预算 E/R = 基准 +1%
    // 预测 E/R：华南等偏高的组织按当前实际近似；预测对预算偏差 = (预测E/R-预算E/R)/预算E/R
    const rows = orgs.map(o=>{ const er=o.salary/o.revenue*100, dev=(er-budgetEr)/budgetEr*100; return { name:o.name, revenue:o.revenue, er, dev, budgetEr, warn: dev>3 }; });
    const alarm = rows.filter(r=>r.warn);
    return `<section class="roi-grid2"><article class="card roi-card roi-kpi-row"><div class="roi-kpi"><span>本年实际 E/R</span><b>${(all.salary/all.revenue*100).toFixed(2)}<small>%</small></b><em>工资包 ${formatWan(all.salary)} ÷ 净回款 ${formatWan(all.revenue)}</em></div><div class="roi-kpi"><span>预算 E/R（参考）</span><b>${budgetEr.toFixed(2)}<small>%</small></b><em>按历史基准 +1%</em></div><div class="roi-kpi"><span>超预算 3% 组织数</span><b>${alarm.length} <small>个</small></b><em>预测 E/R 超预算的组织</em></div></article><div class="roi-status ${alarm.length?'bad':'ok'}"><b>${alarm.length?'典型异常·E/R 超预算':'状态健康'}</b><p>${alarm.length? alarm.map(r=>r.name+'（'+r.er.toFixed(2)+'%）').join('、')+' 预测 E/R 超过预算值 3% 以上，人员成本增幅或高于净回款增幅，建议 HR 介入管控 HC。':'各组织预测 E/R 相对预算偏差未超过 3%，人工成本占比合理。'}</p></div></article><article class="card roi-card roi-table-wrap"><div class="roi-card-head"><div class="roi-card-title"><i>▤</i><div><b>E/R 预测管控 · 分组织</b><span>工资包 / 净回款 · 红色为超预算 3% 预警</span></div></div></div><div class="roi-table-scroll">${roiRenderTable(rows,['一级组织','E/R 预测','预测 vs 预算偏差','预算工资包','预测工资包·当前HC','预测工资包·上限(预算×1.03)','超上限偏差额'], r=>[r.name, r.er.toFixed(2)+'%', (r.dev>0?'+':'')+r.dev.toFixed(2)+'%', (r.budgetEr/100*r.revenue).toFixed(0)+'万', (r.er/100*r.revenue).toFixed(0)+'万', (r.budgetEr/100*r.revenue*1.03).toFixed(0)+'万', ((r.budgetEr/100*r.revenue*1.03)-(r.er/100*r.revenue)).toFixed(0)+'万'], (r,i)=>r.warn && (i===1||i===6))}</div></div></article></section>`;
  }

  }

  function renderPage() {
    if (state.page === 'dashboard') return renderDashboard();
    if (state.page === 'roi-analysis') return renderRoiAnalysis();
    if (state.page === 'finebi-overview') return renderFinebiOverview();
    if (state.page === 'forecast-center' || state.page === 'forecast-models' || state.page === 'forecast-workbench') { if(state.page === 'forecast-models') state.forecastTab='models'; if(state.page === 'forecast-workbench') state.forecastTab='simulate'; return renderForecastCenterV6(); }
    if (state.page === 'data-config') return renderDataConfigV6();
    if (state.page === 'drivers') return renderDrivers();
    if (state.page === 'orgmap') return renderOrgMap();
    if (state.page === 'efficiency') return renderEfficiencyOverview();
    if (state.page === 'efficiency-team') return renderEfficiencyTeam();
    if (state.page === 'efficiency-job') return renderEfficiencyJob();
    if (state.page === 'efficiency-process') return renderEfficiencyProcess();
    if (state.page === 'structure') return renderStructure();
    if (state.page === 'jobs') return renderJobs();
    if (state.page === 'process') return renderProcess();
    if (state.page === 'alerts') return renderAlerts();
    if (state.page === 'import') return renderImport();
    if (state.page === 'metrics') return renderMetricsConfig();
    return renderDashboard();
  }

  function renderApp() {
    renderSidebar();
    $('#breadcrumbPage').textContent = currentPageName();
    document.title = `人效经营驾驶舱｜${currentPageName()}｜M1 真实导入数据驱动原型 V6.6.1`;
    $('#pageViewport').className = 'page-viewport page-enter';
    $('#pageViewport').innerHTML = renderPage();
    setTimeout(() => $('#pageViewport')?.classList.remove('page-enter'), 280);
  }

  function selectUnit(unit) {
    state.selectedUnit = unit;
    state.selectedEfficiencyUnit = unit;
    if (state.page === 'orgmap' || state.page === 'efficiency-team') renderApp();
    else showToast(`已选择「${unit}」，进入组织效能诊断可查看完整分析。`);
  }

  function m1ResetDraft(keepActive=true) {
    state.importStep=1;
    state.uploadedFile='';
    state.importSnapshot=null;
    state.importReadStatus='idle';
    state.importReadError='';
    state.importFileSize=0;
    state.importMappingConfirmed=false;
    state.importScopeConfirmed=false;
    state.importValidated=false;
    state.importPublished=false;
    state.importBatchId='';
    if(!keepActive) { state.activeDataMode='demo'; state.activeM1Batch=''; state.m1Runtime=null; }
  }
  function m1ApplySnapshot(snapshot, fileName, fileSize=0) {
    state.uploadedFile=fileName || snapshot.sourceName;
    state.importSnapshot=snapshot;
    state.importQualityScore=snapshot.qualityScore;
    state.importReadStatus='ready';
    state.importReadError='';
    state.importFileSize=fileSize;
    state.importStep=1;
    state.importMappingConfirmed=false;
    state.importScopeConfirmed=false;
    state.importValidated=false;
    state.importPublished=false;
    state.importBatchId='';
    renderApp();
    showToast(`已在本地解析「${state.uploadedFile}」：${snapshot.stats.recordCount.toLocaleString()} 条记录、${snapshot.blockCount} 项 P0 阻断。`);
  }
  async function loadM1LocalFile(file) {
    if(!file) return;
    state.uploadedFile=file.name;
    state.importReadStatus='loading';
    state.importReadError='';
    state.importFileSize=file.size || 0;
    renderApp();
    try {
      const snapshot=await m1AnalyzeFile(file);
      m1ApplySnapshot(snapshot,file.name,file.size||0);
    } catch(error) {
      state.importReadStatus='error';
      state.importReadError=error?.message || '无法解析当前文件。';
      state.importSnapshot=null;
      renderApp();
      showToast('文件读取失败，请查看错误提示并确认使用标准模板。');
    }
  }
  function loadM1BuiltinSample() {
    try {
      const snapshot=m1BuildSnapshot(M1_STANDARD_SAMPLE,'通用人效分析看板_数据导入模板.xlsx（内置示例）');
      m1ApplySnapshot(snapshot,snapshot.sourceName,0);
    } catch(error) {
      state.importReadStatus='error';
      state.importReadError=error?.message || '无法读取内置示例。';
      renderApp();
    }
  }
  function setImportFile(fileName) {
    state.uploadedFile=fileName;
    state.importReadStatus='idle';
    showToast(`已选择「${fileName}」。正在等待浏览器本地解析。`);
    renderApp();
  }
  function publishM1Batch() {
    const snapshot=state.importSnapshot;
    if(!snapshot) { showToast('请先读取标准数据文件。'); return; }
    if(snapshot.blockCount) { showToast(`存在 ${snapshot.blockCount} 项 P0 阻断，不能发布。`); return; }
    const runtime=m1BuildRuntime(snapshot);
    const period=runtime.latestPeriod || 'UNKNOWN';
    state.importValidated=true;
    state.importPublished=true;
    state.importBatchId=`M1-${period}-001`;
    state.activeM1Batch=state.importBatchId;
    state.activeDataBatch=state.importBatchId;
    state.activeDataMode='imported';
    state.m1Runtime=runtime;
    state.org='全集团';
    state.period=period.replace('-', ' 年 ')+' 月';
    state.importStep=5;
    renderApp();
    showToast('真实导入数据已发布：经营总览、人均效能、组织地图和预测中心现引用同一批次。');
  }

  function changeAlertStatus(status) {
    const p = currentProfile();
    const a = p.alerts[Math.min(state.selectedAlert, p.alerts.length - 1)];
    a.status = status;
    if (status === '已完成') {
      const exist = p.tasks.some(t => t[0] === a.action);
      if (!exist) p.tasks.unshift([a.action, a.owner, '100', a.due, '待复盘']);
    }
    showToast(status === '已完成' ? '行动已标记完成，并已加入待复盘清单。' : '行动状态已更新为“进行中”。');
    renderApp();
  }

  document.addEventListener('click', (event) => {
    const actionTarget=event.target.closest('[data-action]');
    if(actionTarget) {
      const action=actionTarget.dataset.action;
      if(action==='notice') showToast('当前有 3 条预测预警、2 项执行中行动与 1 项待复盘事项。');
      else if(action==='health-detail') showToast('健康度 = 经营结果 30% + 成本效率 20% + 组织结构 15% + 人才成熟度 20% + 交付与质量 15%；权重可在配置页调整。');
      else if(action==='toggle-ai') { const detail=$('#dashboardAiDetail'); if(detail){detail.classList.toggle('hidden'); actionTarget.textContent=detail.classList.contains('hidden')?'展开':'收起';} }
      else if(action==='select-alert') { state.selectedAlert=Number(actionTarget.dataset.index); if(state.page==='alerts'||state.page==='dashboard') renderApp(); }
      else if(action==='start-action') changeAlertStatus('进行中');
      else if(action==='complete-action') changeAlertStatus('已完成');
      else if(action==='export') showToast('原型模式：已模拟导出经营简报。正式版可输出 PDF、Excel 或 BI 分享链接。');
      else if(action==='load-sample'||action==='load-standard-sample') loadM1BuiltinSample();
      else if(action==='import-next') { if(!state.importSnapshot){showToast('请先选择数据文件或读取内置标准模板示例。');return;} state.importStep=2; renderApp(); }
      else if(action==='mapping-next') { if(!state.importSnapshot){showToast('尚未读取数据。');return;} state.importMappingConfirmed=true;state.importStep=3;renderApp();showToast('字段映射已暂存，请确认 M1 核心口径。'); }
      else if(action==='scope-next') { if(!state.importSnapshot){showToast('尚未读取数据。');return;} state.importScopeConfirmed=true;state.importValidated=true;state.importStep=4;renderApp();showToast('M1 核心口径已锁定为 METRIC-M1-V1，正在展示当前文件的对账结果。'); }
      else if(action==='import-publish'||action==='import-generate') publishM1Batch();
      else if(action==='import-prev') { state.importStep=Math.max(1,state.importStep-1); renderApp(); }
      else if(action==='validate-import') { state.importStep=4; state.importValidated=true; renderApp(); }
      else if(action==='reset-import') { m1ResetDraft(true); renderApp(); showToast('已清空本次导入草稿；已发布数据批次保持不变。'); }
      else if(action==='toggle-metric') { const key=actionTarget.dataset.metric;state.metricEnabled[key]=!state.metricEnabled[key];renderApp(); }
      else if(action==='save-metrics') showToast('指标配置已保存为草稿版本，可在正式系统中发起审批并发布。');
      else if(action==='forecast-reset') { state.forecastScenario='baseline';state.forecastFactors={ demand:8, hires:108, hireRate:75, attrition:8.7, salary:3, automation:3 };renderApp();showToast('已恢复基准情景与默认经营假设。'); }
      else if(action==='forecast-generate-plan') { showToast('已根据当前情景生成经营行动建议，可在预测预警队列中创建行动。');document.querySelector('.forecast-alert-list')?.scrollIntoView({behavior:'smooth',block:'center'}); }
      else if(action==='model-train') { showToast('原型演示：正在基于近 12 个月数据重新训练、回测并校验预测模型。');setTimeout(()=>showToast('模型训练完成：4 个模型验证通过，已发布至预测与经营模拟工作台。'),850); }
      else if(action==='forecast-create-action') { const f=v6Forecast(),g=forecastGovernanceState(f.b); if(m1RuntimeAvailable()&&!g.eligible){showToast('当前导入数据尚未满足正式预测准入，只能进行趋势观察和情景讨论，不能自动创建预测行动。');return;} const next=String(35+state.forecastActions.length).padStart(3,'0');state.forecastActions.unshift({id:`ACT-${next}`,risk:'当前预测预警',title:'基于当前杠杆测算的经营改善方案',owner:'经营分析负责人',due:'2026-09-25',effect:`预测利润改善 ${money(Math.max(0,f.profitGap6m))}`,status:'待启动',result:'待回填'});renderApp();showToast('已按当前杠杆测算创建行动，预期改善已自动回填。'); }
      return;
    }
    const unitTarget=event.target.closest('[data-select-unit]');
    if(unitTarget){selectUnit(unitTarget.dataset.selectUnit);return;}
    const pageTarget=event.target.closest('[data-page]');
    if(pageTarget){setHashPage(pageTarget.dataset.page);return;}
  });

  document.addEventListener('change', (event) => {
    if (event.target.id === 'orgSelect') {
      state.org = event.target.value;
      state.selectedAlert = 0;
      state.selectedUnit = '';
      renderApp();
      showToast(`已切换至「${state.org}」数据视图。`);
    }
    if (event.target.id === 'periodSelect') {
      state.period = event.target.value;
      showToast(`已切换分析周期：${state.period}${m1RuntimeAvailable()?'（当前导入数据已发布）':'（当前为模拟数据）'}。`);
      if(m1RuntimeAvailable()) renderApp();
    }
    if (event.target.id === 'roleSelect') {
      state.role = event.target.value;
      renderApp();
      showToast(`已切换至${roleTexts[state.role][0]}。`);
    }
    if (event.target.id === 'filePicker') {
      const file = event.target.files && event.target.files[0];
      if (file) void loadM1LocalFile(file);
    }
  });

  document.addEventListener('submit', (event) => {
    if (event.target.matches('[data-form="ask-ai"]')) {
      event.preventDefault();
      const input = event.target.querySelector('[data-ask-input]');
      const q = input.value.trim();
      if (!q) { showToast('请输入希望分析的人效问题。'); return; }
      const p = currentProfile();
      const title = $('#dashboardAiTitle');
      const summary = $('#dashboardAiSummary');
      const detail = $('#dashboardAiDetail');
      if (title && summary && detail) {
        title.textContent = `围绕「${q}」的预设归因清单 · 待验证`;
        const m=v6Metrics(p);
        summary.textContent = `当前${state.org}：人均利润 ${m.profitPer.toFixed(2)} 万 / FTE，人工成本 ${money(m.labor)}，平均 FTE ${m.fte}。建议按新人 / 成熟员工、订单质量、等待返工和关键岗位供给继续核验。`;
        detail.innerHTML = '• 本结论为规则型预设归因，不代表实时 AI 推理。<br>• 每条归因应通过组织、项目或岗位明细数据验证。<br>• 若缺少数据，应保留“待核验”状态。';
        detail.classList.remove('hidden');
      }
      showToast('已输出引用当前模拟聚合数据的预设归因清单。');
    }
  });

  document.addEventListener('click', (event) => {
    const m1Rule = event.target.closest('[data-m1-rule-filter]');
    if (m1Rule) { state.importRuleFilter=m1Rule.dataset.m1RuleFilter; renderApp(); return; }
    const job = event.target.closest('[data-job-tab]');
    if (job) { state.jobTab = job.dataset.jobTab; renderApp(); }
    const filter = event.target.closest('[data-alert-filter]');
    if (filter) { state.alertFilter = filter.dataset.alertFilter; renderApp(); }
    const industry = event.target.closest('[data-industry]');
    if (industry) { state.industry = industry.dataset.industry; renderApp(); showToast(`已切换到「${state.industry}」行业指标包。`); }
    const finebiTrend = event.target.closest('[data-finebi-trend]');
    if (finebiTrend) { state.finebiTrendTab = finebiTrend.dataset.finebiTrend; renderApp(); showToast(`已切换至${state.finebiTrendTab === 'revenue' ? '人均营收' : '人均利润'}趋势。`); }
    const finebiCost = event.target.closest('[data-finebi-cost]');
    if (finebiCost) { state.finebiCostTrendTab = finebiCost.dataset.finebiCost; renderApp(); showToast('已切换成本趋势口径。'); }
    const finebiDim = event.target.closest('[data-finebi-dim]');
    if (finebiDim) { state.finebiCostDimTab = finebiDim.dataset.finebiDim; renderApp(); showToast(`已切换为按${state.finebiCostDimTab === 'function' ? '职能' : '职级'}查看成本。`); }
    const forecastMetric = event.target.closest('[data-forecast-metric]');
    if (forecastMetric) { state.forecastMetric = forecastMetric.dataset.forecastMetric; renderApp(); showToast(`已切换至「${forecastMetricMeta(state.forecastMetric).name}」预测视图。`); }
    const forecastScenario = event.target.closest('[data-forecast-scenario]');
    if (forecastScenario) {
      const preset=forecastScenario.dataset.forecastScenario;
      state.forecastScenario=preset;
      if(preset==='growth') state.forecastFactors={ demand:16,hires:156,hireRate:88,attrition:7.2,salary:5,automation:5 };
      if(preset==='cost') state.forecastFactors={ demand:4,hires:58,hireRate:72,attrition:8.2,salary:1,automation:8 };
      if(preset==='risk') state.forecastFactors={ demand:-8,hires:72,hireRate:58,attrition:13.2,salary:4,automation:1 };
      if(preset==='baseline') state.forecastFactors={ demand:8,hires:108,hireRate:75,attrition:8.7,salary:3,automation:3 };
      renderApp(); showToast('已应用「'+(preset==='growth'?'增长冲刺':preset==='cost'?'稳健降本':preset==='risk'?'风险承压':'基准')+'」经营情景。');
    }
    const forecastAlert=event.target.closest('[data-forecast-alert]');
    if (forecastAlert && !event.target.closest('[data-action]')) { state.forecastMetric = Number(forecastAlert.dataset.forecastAlert)===0?'profit':Number(forecastAlert.dataset.forecastAlert)===1?'workforce':'cost'; renderApp(); showToast('已聚焦对应的预测指标与影响情景。'); }
    const forecastModel=event.target.closest('[data-forecast-model]');
    if (forecastModel) { state.forecastModel=forecastModel.dataset.forecastModel; renderApp(); showToast(`已选择「${forecastMetricMeta(state.forecastModel).name}预测模型」。`); }
  });

  document.addEventListener('click', (event) => {
    const roiTab = event.target.closest('[data-roi-tab]');
    if (roiTab) { state.roiTab = roiTab.dataset.roiTab; renderApp(); return; }
    const tab = event.target.closest('[data-v6-forecast-tab]');
    if (tab) { state.forecastTab = tab.dataset.v6ForecastTab; renderApp(); return; }
    const metric = event.target.closest('[data-v6-metric]');
    if (metric) { state.forecastMetric = metric.dataset.v6Metric; state.forecastTab='predict'; renderApp(); showToast(`已切换至「${forecastMetricMeta(state.forecastMetric).name}」预测视图。`); return; }
    const model = event.target.closest('[data-v6-model]');
    if (model) { state.forecastModel = model.dataset.v6Model; renderApp(); showToast(`已选择「${forecastMetricMeta(state.forecastModel).name}预测模型」。`); return; }
    const sc = event.target.closest('[data-v6-scenario]');
    if (sc) {
      const x=sc.dataset.v6Scenario; state.forecastScenario=x;
      if(x==='growth') state.forecastFactors={ demand:16,hires:156,hireRate:88,attrition:7.2,salary:5,automation:5 };
      if(x==='cost') state.forecastFactors={ demand:4,hires:58,hireRate:72,attrition:8.2,salary:1,automation:8 };
      if(x==='risk') state.forecastFactors={ demand:-8,hires:72,hireRate:58,attrition:13.2,salary:4,automation:1 };
      if(x==='baseline') state.forecastFactors={ demand:8,hires:108,hireRate:75,attrition:8.7,salary:3,automation:3 };
      renderApp(); showToast('已应用当前经营情景并完成重算。'); return;
    }
  });
  document.addEventListener('input', (event) => {
    const factor = event.target.closest('[data-v6-factor]');
    if (!factor) return;
    state.forecastFactors[factor.dataset.v6Factor]=Number(factor.value);
    clearTimeout(window.__v6timer);
    window.__v6timer=setTimeout(()=>{if(state.page==='forecast-center')renderApp()},120);
  });

  document.addEventListener('dragover', (event) => {
    const zone = event.target.closest('#uploadZone');
    if (zone) { event.preventDefault(); zone.classList.add('drag'); }
  });
  document.addEventListener('dragleave', (event) => {
    const zone = event.target.closest('#uploadZone');
    if (zone) zone.classList.remove('drag');
  });
  document.addEventListener('drop', (event) => {
    const zone = event.target.closest('#uploadZone');
    if (zone) {
      event.preventDefault();
      zone.classList.remove('drag');
      const file = event.dataTransfer.files && event.dataTransfer.files[0];
      if (file) void loadM1LocalFile(file);
    }
  });


  document.addEventListener('click', (event) => {
    const efficiencyJob = event.target.closest('[data-efficiency-job]');
    if (efficiencyJob) {
      state.efficiencyJobTab = efficiencyJob.dataset.efficiencyJob;
      renderApp();
      showToast(`已切换至「${state.efficiencyJobTab}」效能指标包。`);
    }
  });

  let forecastRenderTimer;
  document.addEventListener('input', (event) => {
    const factor = event.target.closest('[data-forecast-factor]');
    if (!factor) return;
    const key=factor.dataset.forecastFactor;
    state.forecastFactors[key]=Number(factor.value);
    const output=document.querySelector(`#forecastOutput-${key}`);
    if(output) output.textContent=`${factor.value}${key==='hires'?'人':'%'}`;
    clearTimeout(forecastRenderTimer);
    forecastRenderTimer=setTimeout(() => { if(state.page==='forecast-workbench') renderApp(); }, 130);
  });

  window.addEventListener('hashchange', () => {
    const route = location.hash.replace('#', '');
    state.page = pageMeta[route] ? route : 'dashboard';
    renderApp();
  });

  const route = location.hash.replace('#', '');
  state.page = pageMeta[route] ? route : 'dashboard';
  if (!location.hash) history.replaceState(null, '', '#dashboard');
  renderApp();
</script>
</body>
</html>
